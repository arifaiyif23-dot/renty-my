<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- CSP is set via HTTP headers (vercel.json / netlify.toml) -->
    <title>Renty — Rent Anything in Malaysia | Peer-to-Peer Rental Marketplace</title>
    <meta name="description" content="Malaysia's trusted peer-to-peer rental platform. Rent cameras, cars, tools, drones and more. Insured rentals, verified users. Earn from items you own.">
    <meta name="keywords" content="rental malaysia, rent items, peer to peer rental, camera rental, car rental, tool rental, malaysia marketplace, renty">
    <meta name="author" content="Renty" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f1729" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RENTY" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Reload page when SW updates (ensures fresh JS on every SW activation) -->
    <script>
      if ('serviceWorker' in navigator) {
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }
    </script>

    <!-- Resource Hints for Performance -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%">
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%">

    <!-- SEO / Social -->
    <meta property="og:locale" content="en_MY" />
    <meta property="og:site_name" content="RENTY" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Renty — Rent Anything in Malaysia">
    <meta property="og:description" content="Malaysia's trusted peer-to-peer rental platform. Rent cameras, cars, tools, drones and more. Insured rentals, verified users.">
    <meta property="og:image" content="https://renty.my/og-image.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@renty_my" />
    <meta name="twitter:title" content="Renty — Rent Anything in Malaysia">
    <meta name="twitter:description" content="Malaysia's trusted peer-to-peer rental platform. Rent cameras, cars, tools, drones and more. Insured rentals, verified users.">
    <meta name="twitter:image" content="https://renty.my/og-image.png">

    <!-- Canonical fallback for pre-JS crawls (per-route canonical injected by SEO component) -->
    <link rel="canonical" href="https://renty.my/">

    <!-- PWA Icons -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

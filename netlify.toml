[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://*.toyyibpay.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.toyyibpay.com; font-src 'self' data:; frame-src 'self' https://*.toyyibpay.com; object-src 'none'; base-uri 'self'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
